kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: multisite-ha-cluster
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  # Master / Control Plane
  - role: control-plane
    labels:
      tier: control-plane

  # Site-A (Primary Data Center) Nodes
  - role: worker
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "topology.kubernetes.io/zone=site-a,datacenter=site-a,topology.kubernetes.io/region=region-west"

  - role: worker
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "topology.kubernetes.io/zone=site-a,datacenter=site-a,topology.kubernetes.io/region=region-west"

  # Site-B (Secondary / Disaster Recovery Data Center) Nodes
  - role: worker
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "topology.kubernetes.io/zone=site-b,datacenter=site-b,topology.kubernetes.io/region=region-east"

  - role: worker
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "topology.kubernetes.io/zone=site-b,datacenter=site-b,topology.kubernetes.io/region=region-east"
